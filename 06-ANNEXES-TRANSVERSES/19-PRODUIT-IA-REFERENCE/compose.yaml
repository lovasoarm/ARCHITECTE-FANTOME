services:
  ia-reference:
    build:
      context: .
      dockerfile: Dockerfile
    image: af-ia-reference:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      API_TOKEN: ${API_TOKEN:?Définir API_TOKEN dans l'environnement}
      API_TENANT_ID: ${API_TENANT_ID:-demo}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-16384}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-2000}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      MAX_IN_FLIGHT: ${MAX_IN_FLIGHT:-32}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-8000}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
