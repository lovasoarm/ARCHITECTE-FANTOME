services:
  platform-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: af-platform-operations-lab:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      AF_DEPENDENCY_READY: ${AF_DEPENDENCY_READY:-true}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
